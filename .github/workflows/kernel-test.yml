name: Kernel Test

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "scripts/semantic-refactor-*.sh"
      - "scripts/semantic-refactor-*/**"
      - "install/empty.dae"
      - ".github/workflows/kernel-test.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "scripts/semantic-refactor-*.sh"
      - "scripts/semantic-refactor-*/**"
      - "install/empty.dae"
      - ".github/workflows/kernel-test.yml"

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: 0
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go 1.26
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: 1.26
        cache: false

    - name: Apply the canonical build experiments
      run: make -s print-goexperiment-env >> "$GITHUB_ENV"

    - name: Go cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-kernel-1.26-${{ hashFiles('**/go.sum', 'Makefile') }}
        restore-keys: |
          ${{ runner.os }}-go-kernel-1.26-

    - name: Validate semantic-refactor scripts
      run: |
        set -euo pipefail
        find scripts -type f -name 'semantic-refactor-*.sh' -exec bash -n {} +

    - name: Generate and build
      run: |
        git submodule update --init
        # The Go experiment set is owned by the Makefile (DEFAULT_GOEXPERIMENT,
        # read with `make -s print-goexperiment`); `make` below exports it, so
        # this workflow must not carry a second copy (scripts/check-build-env.sh).
        make GOFLAGS="-buildvcs=false" CC=clang

    - name: Verify built binary is real eBPF (not stub)
      run: |
        set -euo pipefail
        if strings ./dae | grep -Fq "eBPF objects are unavailable in this build"; then
          echo "stub eBPF build detected in ./dae; expected real eBPF artifact"
          exit 1
        fi

    - name: Verify generated eBPF and kernel C sources
      run: |
        set -euo pipefail
        make ebpf-sync-check
        make ebpf-lint

    - name: Store executable
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dae
        path: dae

  test:
    runs-on: ubuntu-22.04
    name: Test
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Only support 6.6 and 6.12 kernels
        # 6.1 support has been dropped due to BPF verifier limitations
        kernel: [ '6.6-20250527.055456', '6.12-20250527.055456' ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      - name: Retrieve stored executable
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: dae
          path: dae

      # NOTE: do NOT pre-install the LVH host dependencies (qemu, libvirt,
      # virtinst, ...) before the Provision step. find-lvh-cli inside
      # little-vm-helper derives a cache key via
      #   apt-get -s install $dep | grep "Inst $dep"
      # under bash -e -o pipefail; an already-installed package emits no Inst
      # line, the grep exits 1, and provisioning dies silently (~3s, exit 1,
      # both matrix legs). install-dependencies: 'true' lets LVH install the
      # set itself. The 2026-08-14 "held broken packages" apt skew that once
      # motivated a pre-install bypass was a live jammy-updates resolution
      # breakage (the failing step ran only on cache miss) and has healed.
      - name: Provision LVH VMs
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          test-name: dae-test
          image-version: ${{ matrix.kernel }}
          host-mount: ./
          install-dependencies: 'true'
          cmd: |
            chmod +x /host/dae/dae

            apt update
            apt install -y unzip python3

      - name: Check real-BPF reload lifecycle
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -euo pipefail
            /host/scripts/semantic-refactor-smoke.sh lifecycle /host/dae/dae /host/install/empty.dae 16
            test ! -e /sys/fs/bpf/dae
            ! ip link show dae0 >/dev/null 2>&1
            ! ip netns list 2>/dev/null | grep -q '^daens'

      - name: Check local UDP reload lifecycle
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -euo pipefail
            /host/scripts/semantic-refactor-smoke.sh udp-local /host/dae/dae 8
            test ! -e /sys/fs/bpf/dae
            ! ip link show dae0 >/dev/null 2>&1
            ! ip netns list 2>/dev/null | grep -q '^daens'
            ! ip link show dsmoke-udp0 >/dev/null 2>&1
            ! ip netns list 2>/dev/null | grep -q '^dae-semantic-udp-server'
      - name: Setup network
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker network create --ipv6 --subnet 2001:0DB8::/112 dae
            docker run -td --name v2ray --privileged --network dae -v /host:/host ubuntu:22.04 bash
            docker run -td --name dae --privileged --network dae -v /host:/host -v /sys:/sys ubuntu:22.04 bash

      - name: Setup v2ray server
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex
            cd /host

            curl -OL https://github.com/v2fly/v2ray-core/releases/download/v4.31.0/v2ray-linux-64.zip
            unzip v2ray-linux-64.zip
            docker cp ./v2ray v2ray:/usr/bin
            docker cp ./v2ctl v2ray:/usr/bin

            cat > ./v2ray.json <<!
            {
                "log": {
                    "access": "/host/v2ray.access.log",
                    "error": "/host/v2ray.error.log",
                    "loglevel": "warning"
                },
                "inbound": {
                    "port": 23333,
                    "protocol": "vmess",
                    "settings": {
                        "clients": [
                            {
                                "id": "b004539e-0d7b-7996-c378-fb040e42de70",
                                "level": 0,
                                "alterId": 0
                            }
                        ]
                    }
                },
                "outbound": {
                    "protocol": "freedom",
                    "settings": {}
                },
                "inboundDetour": [],
                "outboundDetour": []
            }
            !

            nohup docker exec v2ray v2ray -c /host/v2ray.json &> v2ray.log &
            sleep 5s
            cat v2ray.log

            echo '{"v":"2","ps":"test","add":"v2ray","port":"23333","id":"b004539e-0d7b-7996-c378-fb040e42de70","aid":"0","net":"tcp","tls":"","type":"none","path":"","host":"v2ray"}' > vmess.json

      - name: Setup dae server
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex
            cd /host

            docker exec dae apt update
            docker exec dae apt install -y curl dnsutils netcat

            vmess_link=$(base64 -w0 vmess.json)
            cat > ./conf.dae <<!
            global {
                tproxy_port: 12345
                log_level: trace

                lan_interface: auto
                wan_interface: auto
                allow_insecure: false
                auto_config_kernel_parameter: true
            }

            node {
                local: 'vmess://\$vmess_link'
            }

            group {
                proxy {
                    policy: min_moving_avg
                }
            }

            routing {
                pname(dae) -> direct
                fallback: proxy
            }
            !

            chmod 600 ./conf.dae
            nohup docker exec dae /host/dae/dae run -c /host/conf.dae &> dae.log &
            for i in {1..30}; do
              if grep -Eq 'Loaded eBPF programs and maps|Started control plane|dae started' dae.log; then
                break
              fi
              sleep 1
            done
            if ! docker exec dae sh -c 'grep -qs "^dae$" /proc/[0-9]*/comm'; then
              echo "dae exited before ready"
              cat dae.log
              exit 1
            fi
            cat dae.log

      - name: Check WAN IPv4 TCP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae curl 1.1.1.1:443
            cat /host/v2ray.access.log | grep -q 'accepted tcp:1.1.1.1:443'

      - name: Check WAN IPv4 UDP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae dig @1.1.1.1 one.one.one.one
            cat /host/v2ray.access.log | grep -q 'accepted udp:1.1.1.1:53'

      - name: Check WAN IPv6 TCP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae nc -v -w1 2606:4700:4700::1111 443 &> /host/nc.log
            cat /host/nc.log | grep -q 'succeeded!'
            cat /host/v2ray.access.log | grep -F -- 'accepted tcp' | grep -F -- '2606:4700:4700::1111' | grep -F -- ':443'

      - name: Check WAN IPv6 UDP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            for i in 1 2 3; do
              docker exec dae dig @2606:4700:4700::1111 one.one.one.one && break
              sleep 2
            done
            cat /host/v2ray.access.log | grep -F -- 'accepted udp' | grep -F -- '2606:4700:4700::1111' | grep -F -- ':53'

      - name: Setup WAN UDP port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker restart -t0 dae v2ray
            nohup docker exec v2ray v2ray -c /host/v2ray.json &> v2ray.log &
            nohup docker exec dae /host/dae/dae run -c /host/conf.dae &> dae.log &
            for i in {1..30}; do
              if grep -Eq 'Loaded eBPF programs and maps|Started control plane|dae started' dae.log; then
                break
              fi
              sleep 1
            done
            if ! docker exec dae sh -c 'grep -qs "^dae$" /proc/[0-9]*/comm'; then
              echo "dae exited before ready"
              cat dae.log
              exit 1
            fi
            nohup docker exec dae nc -lu 53 &> nc.log &

      - name: Check WAN IPv4 UDP with port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae dig @1.1.1.1 one.one.one.one
            cat /host/v2ray.access.log | grep -q 'accepted udp:1.1.1.1:53'

      - name: Check WAN IPv6 UDP with port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            for i in 1 2 3; do
              docker exec dae dig @2606:4700:4700::1111 one.one.one.one && break
              sleep 2
            done
            cat /host/v2ray.access.log | grep -F -- 'accepted udp' | grep -F -- '2606:4700:4700::1111' | grep -F -- ':53'

      - name: Setup LAN
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex
            cd /host

            docker restart -t0 dae
            docker exec dae apt install -y iproute2 iptables iputils-ping

            cat >lan.bash <<!
            set -ex

            ip net a dae
            ip l a dae-veth type veth peer name dae-veth-peer
            ip l s dae-veth-peer up
            ip l s dae-veth netns dae
            ip net e dae ip l s dae-veth up
            ip r a 10.0.0.1 dev dae-veth-peer
            ip net e dae ip a a 10.0.0.1 dev dae-veth
            ip net e dae ip r a 169.254.0.1 dev dae-veth
            ip net e dae ip r a default via 169.254.0.1 dev dae-veth

            sysctl net.ipv6.conf.dae-veth-peer.disable_ipv6=0
            ip -6 r a fd00:ffff::1 dev dae-veth-peer
            ip -6 a a fe80::ecee:eeff:feee:eeee dev dae-veth-peer
            ip net e dae ip -6 a a fd00:ffff::1 dev dae-veth
            ip net e dae ip -6 r r default via fe80::ecee:eeff:feee:eeee dev dae-veth

            sysctl net.ipv4.conf.dae-veth-peer.proxy_arp=1
            sysctl net.ipv4.conf.dae-veth-peer.rp_filter=2
            iptables-legacy -t nat -A POSTROUTING -s 10.0.0.1/32 -j MASQUERADE
            !
            docker exec dae bash /host/lan.bash

            docker exec dae ping -c1 10.0.0.1
            docker exec dae ip net e dae curl 1.0.0.1
            docker exec dae ping -c1 fd00:ffff::1

            docker exec dae sysctl net.ipv4.conf.dae-veth-peer.send_redirects=0
            docker exec dae sysctl net.ipv6.conf.dae-veth-peer.forwarding=1

            vmess_link=$(base64 -w0 vmess.json)
            cat > ./conf.dae <<!
            global {
                tproxy_port: 12345
                log_level: trace

                lan_interface: dae-veth-peer
                wan_interface: dae-veth-peer,eth0
                allow_insecure: false
                auto_config_kernel_parameter: true
            }

            node {
                local: 'vmess://\$vmess_link'
            }

            group {
                proxy {
                    policy: min_moving_avg
                }
            }

            routing {
                pname(dae) -> direct
                fallback: proxy
            }
            !

            chmod 600 ./conf.dae
            nohup docker exec dae /host/dae/dae run -c /host/conf.dae &> dae.log &
            for i in {1..30}; do
              if grep -Eq 'Loaded eBPF programs and maps|Started control plane|dae started' dae.log; then
                break
              fi
              sleep 1
            done
            if ! docker exec dae sh -c 'grep -qs "^dae$" /proc/[0-9]*/comm'; then
              echo "dae exited before ready"
              cat dae.log
              exit 1
            fi
            cat dae.log

      - name: Check LAN IPv4 TCP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae ip net e dae curl 1.0.0.1
            cat /host/v2ray.access.log | grep -q 'accepted tcp:1.0.0.1:80'

      - name: Check LAN IPv4 UDP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae ip net e dae dig @8.8.4.4 one.one.one.one
            cat /host/v2ray.access.log | grep -q 'accepted udp:8.8.4.4:53'

      - name: Check LAN IPv6 TCP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae ip net e dae nc -v -w1 2606:4700:4700::1001 80 &> /host/nc.log
            cat /host/nc.log | grep -q 'succeeded!'
            cat /host/v2ray.access.log | grep -F -- 'accepted tcp' | grep -F -- '2606:4700:4700::1001' | grep -F -- ':80'

      - name: Check LAN IPv6 UDP
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            for i in 1 2 3; do
              docker exec dae ip net e dae dig @2001:4860:4860::8844 one.one.one.one && break
              sleep 2
            done
            cat /host/v2ray.access.log | grep -F -- 'accepted udp' | grep -F -- '2001:4860:4860::8844' | grep -F -- ':53'

      - name: Setup LAN UDP port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker restart -t0 dae v2ray

            docker exec dae rm -f /var/run/netns/dae
            docker exec dae bash /host/lan.bash
            docker exec dae sysctl net.ipv4.conf.dae-veth-peer.send_redirects=0
            docker exec dae sysctl net.ipv6.conf.dae-veth-peer.forwarding=1

            nohup docker exec v2ray v2ray -c /host/v2ray.json &> v2ray.log &
            nohup docker exec dae /host/dae/dae run -c /host/conf.dae &> dae.log &
            for i in {1..30}; do
              if grep -Eq 'Loaded eBPF programs and maps|Started control plane|dae started' dae.log; then
                break
              fi
              sleep 1
            done
            if ! docker exec dae sh -c 'grep -qs "^dae$" /proc/[0-9]*/comm'; then
              echo "dae exited before ready"
              cat dae.log
              exit 1
            fi
            nohup docker exec dae nc -lu 53 &> nc.log &

            # Wait for IPv6 connectivity to converge after namespace rebuild
            sleep 3
            docker exec dae ping -c1 fd00:ffff::1

      - name: Check LAN IPv4 UDP with port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            docker exec dae ip net e dae dig @8.8.4.4 one.one.one.one
            cat /host/v2ray.access.log | grep -q 'accepted udp:8.8.4.4:53'

      - name: Check LAN IPv6 UDP with port conflict
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          provision: 'false'
          cmd: |
            set -ex

            for i in 1 2 3; do
              docker exec dae ip net e dae dig @2001:4860:4860::8844 one.one.one.one && break
              sleep 2
            done
            cat /host/v2ray.access.log | grep -F -- 'accepted udp' | grep -F -- '2001:4860:4860::8844' | grep -F -- ':53'
