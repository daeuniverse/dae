name: BPF Test

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test for a release
        type: string
        required: true
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "control/**/*.go"
      - "pkg/ebpf_internal/**"
      - "trace/**"
      - "scripts/ebpf-audit.sh"
      - "scripts/check-trace-arch-matrix.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/bpf-test.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.c"
      - "**/*.h"
      - "control/**/*.go"
      - "pkg/ebpf_internal/**"
      - "trace/**"
      - "scripts/ebpf-audit.sh"
      - "scripts/check-trace-arch-matrix.sh"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/bpf-test.yml"

permissions:
  contents: read

jobs:
  bpf_tests:
    name: BPF Unit Test (${{ matrix.env.VERSION }})
    # Each clang comes from the archive of the image that still ships it: Ubuntu 26.04 dropped 15 to 19.
    # No image ships 23 yet, so it comes from apt.llvm.org.
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        include:
        - {os: ubuntu-24.04, env: {VERSION: 15}}
        - {os: ubuntu-24.04, env: {VERSION: 16}}
        - {os: ubuntu-24.04, env: {VERSION: 17}}
        - {os: ubuntu-24.04, env: {VERSION: 18}}
        - {os: ubuntu-24.04, env: {VERSION: 19}}
        - {os: ubuntu-26.04, env: {VERSION: 20}}
        - {os: ubuntu-26.04, env: {VERSION: 21}}
        - {os: ubuntu-26.04, env: {VERSION: 22}}
        - {os: ubuntu-26.04, env: {VERSION: 23}}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27

      - name: Apply the canonical build experiments
        run: make -s print-goexperiment-env >> "$GITHUB_ENV"

      - name: Install Dependencies
        env: ${{ matrix.env }}
        run: |
          sudo apt-get update -y
          if ! apt-cache show clang-$VERSION >/dev/null 2>&1; then
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
            echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-$VERSION main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
            sudo apt-get update -y
          fi
          sudo apt-get install -y clang-$VERSION llvm-$VERSION iproute2 iputils-ping

      - name: Run BPF tests
        env: ${{ matrix.env }}
        run: |
          git submodule update --init
          sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED CLANG=clang-$VERSION make ebpf-test || (echo "Run 'make ebpf-test' locally to investigate failures"; exit 1)
          if [ "$VERSION" = 19 ]; then
            set -euo pipefail
            sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED CLANG=clang-$VERSION make ebpf
            # Whitelist of the test cases that must actually RUN from the
            # !dae_stub_ebpf test files. Before this step only one case
            # (TestTCHookSetKernelUpdateAndRollback) ran while eight real
            # datapath cases were merely compiled.
            #
            # Direction 1 below rejects any func Test* in a !dae_stub_ebpf file
            # that is not listed here, so a new case in such a file must be
            # added below even when it needs no datapath: the point is that it
            # runs in the real (non-stub) build rather than only compiling.
            whitelist=(
              TestTCHookSetKernelUpdateAndRollback
              TestOffloadObjectsInSpec
              TestDataplaneProgramsAndMapsComplete
              TestAssignDataplaneToBpfCopiesMandatoryObjects
              TestBatchDeleteIgnoringMissingResumesSuffix
              TestBatchDeleteIgnoringMissingAllAbsent
              TestBatchDeleteIgnoringMissingPreservesPartialCountOnError
              TestBatchDeleteIgnoringMissingRejectsSilentPartialProgress
              TestBpfMapBatchDeleteRealMapResumesAfterMissingKey
              # Log-level contracts for the real loader (they exercise the
              # production helper and its source contract; no BPF map needed).
              TestRemovedIncompatiblePinnedMapWarnsWithConsequence
              TestIncompatiblePinRemovalIsNotAnInfoStep
              # Cgroup2 mount-point probe cache (concurrent consistency of the
              # sync.OnceValues singleton; reads /proc/mounts, no BPF map needed).
              TestDetectCgroupPathCaching
              TestProductionProgramsLoad
              # daeParam field offsets must match struct dae_param in
              # kern/tproxy.c; a drift moves a kernel parameter instead of
              # failing the load. Needs no BPF map.
              TestDaeParamLayout
              # The direct-stats observer declares its own copies of
              # tuples_key and conn_state; a drift from tproxy.c makes it read
              # another field's bytes. Pure layout checks, no BPF map needed.
              TestDirectStatsConnStateABIParity
              TestDirectStatsTuplesKeyABIParity
              # The observer object must not reintroduce the removed NAT reverse map.
              TestDirectStatsObjectHasNoNATReverseMap
              # The counter-map value layout must match the Go decoder.
              TestDirectStatsCounterValueLayout
              # Load the observer object's programs through the verifier; the ABI
              # tests only compare Go layouts.
              TestDirectStatsProgramsLoad
            )
            printf '%s\n' "${whitelist[@]}" | sort -u > /tmp/datapath-whitelist.txt

            # Direction 1: every func Test* in a !dae_stub_ebpf test file must be
            # whitelisted, so a new/renamed case cannot silently stop running.
            mapfile -t tagged_files < <(git grep -l 'go:build !dae_stub_ebpf' -- '*_test.go')
            declared="$(grep -hE '^func (Test[A-Za-z0-9_]*)\(' "${tagged_files[@]}" \
              | sed -E 's/^func (Test[A-Za-z0-9_]*)\(.*/\1/' \
              | grep -v '^TestMain$' | sort -u)"
            missing="$(comm -23 <(printf '%s\n' "$declared") /tmp/datapath-whitelist.txt)"
            if [ -n "$missing" ]; then
              echo "::error::!dae_stub_ebpf test case(s) missing from the -test.run whitelist in bpf-test.yml: $(echo $missing | tr '\n' ' ')"
              exit 1
            fi

            # Direction 2: every whitelisted case must actually pass.
            # The compile step runs under sudo too: the earlier root-owned
            # `make ebpf-test` creates root-owned directories inside the
            # shared GOMODCACHE, so an unprivileged `go test -c` fails with
            # "mkdir ... permission denied" whenever the dependency set needs
            # a module directory the root run did not create. Keeping the
            # whole direction root-side avoids the mixed-ownership cache.
            run_regex="^($(paste -sd'|' /tmp/datapath-whitelist.txt))$"
            sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED go test -c ./control -o /tmp/dae-control-datapath.test
            sudo /tmp/dae-control-datapath.test -test.run "$run_regex" -test.count=1 -test.v | tee /tmp/datapath.log
            failed=0
            while IFS= read -r name; do
              if ! grep -qE -- "--- PASS: ${name}([[:space:]]|$)" /tmp/datapath.log; then
                echo "::error::whitelisted test '${name}' did not report '--- PASS' (renamed, removed or skipped?)"
                failed=1
              fi
            done < /tmp/datapath-whitelist.txt
            [ "$failed" -eq 0 ] || exit 1
          fi

      # TRACE_UNSUPPORTED_GOARCH is a machine-checked claim, not a
      # comment. Every listed architecture must really fail to generate trace
      # (and a control architecture must really succeed, so a missing compiler
      # cannot make the gate pass vacuously). Guarded to one matrix leg: it
      # compiles trace once per checked architecture.
      # clang 19 already runs this test with the datapath whitelist above.
      - name: Load the production object
        if: matrix.env.VERSION != 19
        env: ${{ matrix.env }}
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED CLANG=clang-$VERSION make ebpf
          sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED go test -c ./control -o /tmp/dae-control-load.test
          sudo /tmp/dae-control-load.test -test.run '^TestProductionProgramsLoad$' -test.count=1 -test.v | tee /tmp/load.log
          grep -qE -- '--- PASS: TestProductionProgramsLoad([[:space:]]|$)' /tmp/load.log

      - name: Trace architecture ledger
        if: matrix.env.VERSION == 19
        env: ${{ matrix.env }}
        run: |
          git submodule update --init
          # The step above runs the kernel tests through sudo, so the generated
          # trace objects under trace/ are owned by root and a plain user cannot
          # regenerate them ("unable to open output file ... Operation not
          # permitted"). Run the ledger with the same privileges and keep the Go
          # environment, which is the form scripts/ebpf-audit.sh already uses.
          sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED \
            CLANG=clang-$VERSION STRIP=llvm-strip-$VERSION \
            ./scripts/check-trace-arch-matrix.sh

  bpf_kernel_list:
    name: BPF Kernel list
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
    steps:
      - name: Pick a build of each supported kernel line
        id: list
        run: |
          set -euo pipefail
          fetch() { curl -fsSL --retry 5 --retry-all-errors "$@"; }
          # dae needs 5.17 or newer (docs/en/README.md), so the oldest line
          # tested is the oldest maintained longterm line from 5.17 on.
          min=5.17
          lines=$(fetch https://www.kernel.org/releases.json \
            | jq -r '.releases[] | select((.moniker == "longterm" or .moniker == "stable") and (.iseol | not)) | .version' \
            | cut -d. -f1,2 | sort -uV \
            | while read -r line; do
                if [ "$(printf '%s\n' "$min" "$line" | sort -V | head -1)" = "$min" ]; then echo "$line"; fi
              done)
          base=https://kernel.ubuntu.com/mainline
          index=$(fetch "$base/")
          list() { grep -oE "href=\"$1/\"" <<<"$index" | sed -E 's/^href="|\/"$//g' | sort -Vr || true; }
          stable=$(list 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          kernels='[]'
          for line in $lines mainline; do
            if [ "$line" = mainline ]; then
              # Right after a release the newest rc is older than stable.
              candidates=$(list 'v[0-9]+\.[0-9]+-rc[0-9]+' | while read -r v; do
                newer=$(printf '%s\n' "${v%-rc*}" "$stable" | sort -V | tail -1)
                if [ "$newer" = "${v%-rc*}" ] && [ "$newer" != "$stable" ]; then echo "$v"; fi
              done)
            else
              candidates=$(list "v${line//./\\.}(\\.[0-9]+)?")
            fi
            # Take the newest version whose amd64 build succeeded.
            version=
            for v in $candidates; do
              listing=$(fetch "$base/$v/amd64/" || true)
              if grep -qE 'linux-image-unsigned-[^"]*-generic_[^"]*_amd64\.deb' <<<"$listing"; then
                version=$v
                break
              fi
              echo "::warning::Skipping $v: no amd64 image found"
            done
            if [ -n "$version" ]; then
              kernels=$(jq -c --arg k "$line" --arg v "$version" '. + [{kernel: $k, version: $v}]' <<<"$kernels")
            elif [ "$line" = mainline ]; then
              echo "::notice::No rc newer than $stable to test"
            else
              echo "::warning::No amd64 build of $line to test yet"
            fi
          done
          echo "kernels=$kernels" | tee -a "$GITHUB_OUTPUT"

  bpf_kernels:
    name: BPF Kernel (${{ matrix.kernel }})
    # The runners all boot 7.0, so this is where the longterm lines, and the
    # 32-byte stack rounding of kernels before 6.9, are tested. Builds come
    # from Ubuntu's mainline archive; a mainline failure does not block.
    needs: [bpf_kernel_list]
    if: needs.bpf_kernel_list.outputs.kernels != '[]'
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.kernel == 'mainline' }}
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.bpf_kernel_list.outputs.kernels) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27

      - name: Apply the canonical build experiments
        run: make -s print-goexperiment-env >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-22 llvm-22 qemu-system-x86 busybox-static cpio

      # kernel.ubuntu.com sometimes drops TLS connections from the runners,
      # so each build is downloaded once and then served from the cache.
      - name: Cache the kernel
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/kernel.deb
          key: ubuntu-mainline-kernel-${{ matrix.version }}

      - name: Fetch the kernel
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          echo "Kernel $VERSION"
          if [ ! -s ~/kernel.deb ]; then
            fetch() { curl -fsSL --retry 5 --retry-all-errors "$@"; }
            base=https://kernel.ubuntu.com/mainline/$VERSION/amd64
            deb=$(fetch "$base/" | grep -oE 'linux-image-unsigned-[^"]*-generic_[^"]*_amd64\.deb' | head -1)
            fetch -o ~/kernel.deb "$base/$deb"
          fi
          dpkg-deb -x ~/kernel.deb /tmp/kernel
          cp /tmp/kernel/boot/vmlinuz-* /tmp/vmlinuz

      - name: Build the tests
        run: |
          set -euo pipefail
          git submodule update --init
          root=/tmp/initrd
          mkdir -p $root/bin $root/proc $root/sys $root/dev $root/tmp
          as_root() { sudo --preserve-env=PATH,HOME,GOCACHE,GOMODCACHE,GOPATH,GOFLAGS,GOEXPERIMENT,CGO_ENABLED "$@"; }
          # `make ebpf` removes the test objects, so it runs first.
          as_root CLANG=clang-22 make ebpf
          as_root CLANG=clang-22 make ebpf-test
          as_root go test -c ./control -o $root/load.test
          as_root go test -c -tags dae_bpf_tests ./control/kern/tests/ -o $root/kernel.test
          cp /usr/bin/busybox $root/bin/busybox
          cat > $root/init <<'EOF'
          #!/bin/busybox sh
          /bin/busybox --install -s /bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          mount -t bpf bpf /sys/fs/bpf
          mount -t cgroup2 cgroup2 /sys/fs/cgroup
          mount -t tracefs tracefs /sys/kernel/tracing
          mount -t tmpfs tmpfs /tmp
          ip link set lo up
          uname -r
          # The tests back-date state by 10 s with bpf_ktime_get_ns().
          sleep 30
          /load.test -test.run '^TestProductionProgramsLoad$' -test.count=1 -test.v
          echo "load exit $?"
          /kernel.test -test.count=1 -test.v
          echo "kernel exit $?"
          poweroff -f
          EOF
          chmod +x $root/init
          (cd $root && sudo find . | sudo cpio -o -H newc --quiet | gzip -1 > /tmp/initrd.gz)

      - name: Run the tests in a VM
        run: |
          set -euo pipefail
          sudo timeout 900 qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 4 -nographic -no-reboot \
            -kernel /tmp/vmlinuz -initrd /tmp/initrd.gz -append "console=ttyS0 quiet panic=-1" -net none | tee /tmp/vm.log
          grep -q '^load exit 0' /tmp/vm.log
          grep -q '^kernel exit 0' /tmp/vm.log

  bpf_abi_big_endian:
    name: BPF ABI (s390x)
    # Ubuntu 26.04 has no qemu-user-static package.
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27

      - name: Apply the canonical build experiments
        run: make -s print-goexperiment-env >> "$GITHUB_ENV"

      - name: Install s390x emulator
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-user-static

      - name: Run BPF ABI tests on big-endian target
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=s390x go test -tags dae_stub_ebpf -c ./control -o /tmp/dae-control-s390x.test
          qemu-s390x-static /tmp/dae-control-s390x.test -test.run 'Test(NativeBpfABI|BpfHostABI|ParseDaeEvent)' -test.count=1
